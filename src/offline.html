<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Keine Verbindung</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111; color: #ece9e2; font: 16px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 460px; padding: 24px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 8px; color: #e6b422; }
  p { color: #a9a59c; margin: 0 0 18px; }
  button { font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 8px; border: 0; background: #e6b422; color: #1a1500; cursor: pointer; }
  code { font-size: 13px; color: #6f6b63; }
</style>
</head>
<body>
<main>
  <h1>Keine Verbindung zum Intranet</h1>
  <p>Die Seite konnte nicht geladen werden. Prüfe die Internetverbindung und versuche es noch einmal.</p>
  <button id="retry" type="button">Erneut versuchen</button>
  <p style="margin-top:18px"><code id="err"></code></p>
</main>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('err').textContent = q.get('err') || '';
  document.getElementById('retry').addEventListener('click', () => { const u = q.get('url'); if (/^https?:\/\//.test(u)) location.href = u; });
</script>
</body>
</html>
